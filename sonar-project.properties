sonar.projectKey=trendpay-rep
sonar.projectName=TrendPay
sonar.projectVersion=1.0

sonar.sources=.
sonar.sourceEncoding=UTF-8

sonar.exclusions=**/node_modules/**,**/.next/**,**/.turbo/**,**/dist/**,**/build/**,**/coverage/**,**/.git/**,**/.claude/**,**/*.min.js,**/*.d.ts,**/generated/**,**/prisma/migrations/**,**/.env,**/.env.*

sonar.javascript.lcov.reportPaths=packages/api/coverage/lcov.info

# apps/web is presentation-only React/Next code with no test framework set up yet;
# excluded from the coverage ratio rather than counted as untested business logic.
sonar.coverage.exclusions=**/*.config.js,**/*.config.ts,**/next-env.d.ts,**/scripts/**,apps/web/**