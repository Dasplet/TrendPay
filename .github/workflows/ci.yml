name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run -w @trendpay/database generate
        env:
          DATABASE_URL: "postgresql://test:test@localhost:5432/trendpay_test"

      - name: Run tests
        run: npm run test
        env:
          NODE_ENV: test
          DATABASE_URL: "postgresql://test:test@localhost:5432/trendpay_test"
          JWT_SECRET: "test-secret-key-for-ci"
          JWT_REFRESH_SECRET: "test-refresh-secret-for-ci"
          ENCRYPTION_KEY: "test-32-char-encryption-key-here"

      - name: Build
        run: npm run build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Railway
        uses: bervProject/railway-deploy@main
        with:
          railway_token: ${{ secrets.RAILWAY_TOKEN }}
          service: trendpay-api
